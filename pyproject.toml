[project]
name = "vl"
version = "0.1.0"
description = "Visual-latent training: anchor-grounded latents for visual reasoning under frozen consumer models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Joonhee Oh" }]
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.49.0",
    "accelerate>=1.4.0",
    "peft>=0.14.0",
    "trl>=0.16.0",
    "datasets>=3.2.0",
    "pillow>=11.0.0",
    "pyyaml>=6.0.0",
    "wandb>=0.19.0",
    "qwen-vl-utils>=0.0.10",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.45.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vl"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines OK; ruff format handles wrapping

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"
