# Phase 2 — canonical Stage 2 scaled-down recipe (1000 steps × eff_batch=16)
base_model: Qwen/Qwen2.5-VL-3B-Instruct

latent_size: 8
ce_emphasize_factor: 4.0
alignment_weight: 2.0
emphasize_latent_weight: 2.0
alignment_layer: all_layers

lr: 1.0e-5
weight_decay: 0.01
warmup_steps: 10        # matches upstream
max_steps: 1000
grad_accum_steps: 8   # deviation from upstream's 16; halves wall-clock to fit budget. eff_batch=8 vs paper's 128.

gradient_checkpointing: true

global_max_pixels: 784000
per_img_pixels: 392000
min_pixels: 3136
max_pixels: 784000

n_train_examples: 5000

data_path: phase0_monet_probe/data/Monet-SFT-125K/Visual_CoT/train.json
dataset_root: phase0_monet_probe/data/Monet-SFT-125K
teacher_reps_dir: phase2_monet_stage2/teacher_reps

out_dir: phase2_monet_stage2/results/run_p2
log_every: 10
save_every: 0   # final-only

seed: 0
