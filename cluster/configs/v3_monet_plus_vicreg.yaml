# V3 — Monet Stage 2 recipe + additive VICReg.
#
# Hypothesis: VICReg (which solved Pivot A's collapse at 3B) ALSO helps the
# Monet recipe. Same Stage 2 init/loss/eff_bsz/training as stage2_monet.yaml
# PLUS lambda_reg * vicreg_loss(latent slot hidden states).
#
# Reg params start gentler than the G recipe (lambda_reg=1.0 not 2.0):
# align-obs already provides per-position pull, so we don't need as much
# variance hinge pressure. If V3 outperforms Stage 2 baseline, sweep up.

run_name: v3_monet_plus_vicreg
wandb: true
wandb_project: visual-latents

base_model: Qwen/Qwen2.5-VL-7B-Instruct
init_ckpt: /data/joonhee/visual-latents/cluster_phase3/stage1_sft/checkpoint

latent_size: 8
ce_emphasize_factor: 4.0
alignment_weight: 2.0
emphasize_latent_weight: 2.0
alignment_layer: all_layers
use_attn_mask_4d: true

# VICReg additive (matches G/D2 reg knobs except lambda_reg=1.0)
lambda_reg: 1.0
reg_var_w: 1.0
reg_cov_w: 0.04
reg_gamma: 1.0

# Data
subset: Visual_CoT
n_train_examples: 0
eval_holdout: 200

# Optim / schedule (matches stage2_monet.yaml)
lr: 1.0e-5
weight_decay: 0.01
warmup_steps: 100
max_steps: 2000
grad_accum_steps: 16

gradient_checkpointing: true
global_max_pixels: 784000
per_img_pixels: 392000
min_pixels: 3136
max_pixels: 784000

out_dir: /data/joonhee/visual-latents/cluster_phase3/v3_monet_plus_vicreg
log_every: 10
save_every: 500

seed: 0
