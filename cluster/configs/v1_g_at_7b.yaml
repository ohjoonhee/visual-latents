# V1 — G recipe at 7B/125K (cluster scale-up of pivot_a/configs/pivot_a_vicreg_K4_2k.yaml).
#
# G is the strongest Pivot A configuration we produced locally:
#   D2 (VICReg λ_reg=2, mean-MSE LVR) + F (K=4) + E (2× steps) stacked.
# Local result at 3B/5K: utility +0.222 nat, mean cos 0.372, n_helpful 50%.
# At cluster scale we keep the K=4 / λ_reg=2.0 recipe — V2 sweeps K=8.
#
# CONTROLLED COMPARISON: trains on the SAME Monet-SFT-125K Visual_CoT
# (eval-200 excluded) as Stage 1 SFT, Stage 2 baseline, and V3. Eval is
# the same 200-example held-out for all variants. Pivot A's per-example
# tuple `(image, question, answer, bbox)` is extracted from each Monet
# trace by the trainer; bbox falls back to a center-crop when absent
# (Monet-SFT-125K provides auxiliary images, not coordinate boxes — see
# trainer_pivot.py header).

run_name: v1_g_at_7b
wandb: true
wandb_project: visual-latents

base_model: Qwen/Qwen2.5-VL-7B-Instruct
init_ckpt: /data/joonhee/visual-latents/cluster_phase3/stage1_sft/checkpoint

# Pivot A (from G recipe)
K: 4
lambda_lvr: 1.0
loss_form: mean_d
reg_kind: vicreg
lambda_reg: 2.0
reg_var_w: 1.0
reg_cov_w: 0.04
reg_gamma: 1.0

# Data — Monet-SFT-125K Visual_CoT (matches Stage 1, Stage 2, V3).
dataset_format: monet_sft_125k
subset: Visual_CoT
n_train_examples: 0       # 0 = full train slice (eval-200 excluded)
eval_holdout: 200

# Optim / schedule
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 100
# 2 epochs over ~118K / eff_bsz=128 ≈ 1844 steps; budget 2000 (matches Stage 2).
max_steps: 2000
grad_accum_steps: 16

# Memory
gradient_checkpointing: true
min_pixels: 3136
max_pixels: 784000        # matches stage2_monet.yaml
global_max_pixels: 784000
per_img_pixels: 392000

# Logging
out_dir: /data/joonhee/visual-latents/cluster_phase3/v1_g_at_7b
log_every: 10
save_every: 500           # 2k step budget; checkpoint mid-run for safety

seed: 0
