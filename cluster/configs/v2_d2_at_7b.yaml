# V2 — D2 recipe at 7B/125K (K=8 sensitivity probe vs V1 K=4).
#
# D2 was the K=8 PASS configuration: VICReg λ_reg=2.0, mean-MSE LVR.
# Local mean cos 0.341, qwen_base utility +0.050. K=8 dilution at 5K
# was identified as the binding constraint (Experiment F cut K to 4
# and got 50% helpful rate). At cluster scale (118K Visual_CoT) the
# dilution argument is weaker, so K=8 may now do well.
#
# CONTROLLED COMPARISON: same dataset (Monet-SFT-125K Visual_CoT, eval-200
# excluded) and eval set (200 held-out) as Stage 1, Stage 2, V1, V3.

run_name: v2_d2_at_7b
wandb: true
wandb_project: visual-latents

base_model: Qwen/Qwen2.5-VL-7B-Instruct
init_ckpt: /data/joonhee/visual-latents/cluster_phase3/stage1_sft/checkpoint

K: 8
lambda_lvr: 1.0
loss_form: mean_d
reg_kind: vicreg
lambda_reg: 2.0
reg_var_w: 1.0
reg_cov_w: 0.04
reg_gamma: 1.0

# Data — Monet-SFT-125K Visual_CoT (matches Stage 1, Stage 2, V1, V3).
dataset_format: monet_sft_125k
subset: Visual_CoT
n_train_examples: 0
eval_holdout: 200

lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 100
# 2 epochs over ~118K / eff_bsz=128 ≈ 1844 steps; budget 2000 (matches Stage 2).
max_steps: 2000
grad_accum_steps: 16

gradient_checkpointing: true
min_pixels: 3136
max_pixels: 784000        # matches stage2_monet.yaml
global_max_pixels: 784000
per_img_pixels: 392000

out_dir: /data/joonhee/visual-latents/cluster_phase3/v2_d2_at_7b
log_every: 10
save_every: 500

seed: 0
