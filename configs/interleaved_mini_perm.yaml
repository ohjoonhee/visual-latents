# Interleaved Coconut-style POC config — TEMPLATE-PERMUTED CONTROL.
# Identical to interleaved_mini.yaml except `interleaved.permute_template: true`.
# Per design §11.3: trace text is built from a different template than the
# (question, answer) the reader scores against. If NLL improves at the same rate
# as the natural pairing, the model is exploiting trace-template surface form.
#
# Run with:
#   uv run python -m vl.train --config configs/interleaved_mini_perm.yaml --variant interleaved

name: interleaved_mini_perm
cell: interleaved_mini_perm

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8
  lora_r: 16
  stage1_attention_mask: false

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86
  K_q: 2
  curriculum_warmup_steps: 10

data:
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved
  batch_size: 1
  gradient_checkpointing: false
  max_steps: 50
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 25
  ckpt_every_steps: 25

interleaved:
  T_blocks: 2
  k_latent: 4
  use_synthetic_data: true
  permute_template: true        # design §11.3 control

wandb:
  enabled: false
  run_name: interleaved_mini_perm
  tags: [interleaved, poc, local, control]
