# Round-4 binding test: Visual-CoT + Stage-1 grounding — PERM CONTROL.
# Identical to interleaved_viscot_stage1_100.yaml except permute_template=true.
#
# Permutation: image fed to recurrence is from group-A; (q, a) pairs the reader
# scores are from group-B (different image_id, possibly different source).
# V_sem targets follow group-A's image — so the grounding signal pulls h
# toward group-A's content while reader-NLL is mismatched. If the design
# uses image content properly, natural should beat this control by ≥0.5 nat.

name: interleaved_viscot_stage1_perm_100
cell: interleaved_viscot_stage1_perm_100

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8
  lora_r: 16
  stage1_attention_mask: false

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.0
  w_norm: 0.0
  target_norm: 57.86
  K_q: 3
  curriculum_warmup_steps: 10
  norm_weight_end: 0.0

data:
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved
  batch_size: 1
  gradient_checkpointing: false
  max_steps: 1000
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 50
  ckpt_every_steps: 100

interleaved:
  T_blocks: 2
  k_latent: 4
  data_source: viscot
  viscot_hub_repo: ohjoonhee/visual-cot-50k-poc
  viscot_vsem_train: data/viscot/viscot_50k_train_vsem.parquet
  viscot_vsem_eval:  data/viscot/viscot_1k_eval_vsem.parquet
  stage1_warmup_steps: 500
  permute_template: true             # PERM (binding-test condition B)
  multi_q_per_image: false

wandb:
  enabled: false
  run_name: interleaved_viscot_stage1_perm_100
  tags: [interleaved, poc, local, viscot, stage1, R2, multi-q, perm]
