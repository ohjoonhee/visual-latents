# Interleaved Coconut-style POC config (`docs/INTERLEAVED_LATENT_DESIGN.md` §9).
# Parallels configs/mini.yaml shape; differs in:
#   - K = T_blocks * k_latent  (8 = 2 * 4 by default)
#   - new `interleaved` section with T_blocks / k_latent knobs
#   - K_q = 2 (single-image multi-Q identical to parallel mini)
#
# Run with:
#   uv run python -m vl.train --config configs/interleaved_mini.yaml --variant interleaved

name: interleaved_mini
cell: interleaved_mini

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8                           # K_total = T_blocks * k_latent
  lora_r: 16
  stage1_attention_mask: false   # not used by interleaved variant; kept for schema parity

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86             # μ for Qwen2.5-VL parallel; reuse for interleaved
  K_q: 2
  curriculum_warmup_steps: 10    # design §6.4: scaled to 50-step POC budget

data:
  # Synthetic mode is on by default in interleaved.trainer; the data section is
  # kept here for schema parity but is unused by the interleaved trainer in POC.
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved           # the train.py dispatcher reads --variant; this is hint-only
  batch_size: 1                  # design §9: B=1 for A6000
  gradient_checkpointing: false  # design §8.2: avoided for the recurrent forward
  max_steps: 50
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 25
  ckpt_every_steps: 25

interleaved:
  T_blocks: 2
  k_latent: 4
  use_synthetic_data: true       # POC: hand-written templates + solid-color images

wandb:
  enabled: false
  run_name: interleaved_mini
  tags: [interleaved, poc, local]
