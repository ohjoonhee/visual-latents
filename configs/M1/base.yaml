# M1 (medium training, 100K samples, ~14 days on 4×H100).
# Skeleton only — populate after round-3 cells pass and the recipe is locked.
# Chained sbatch required (1-day cap on gpu-4farm); see slurm/M1_chain.sbatch (TODO).
# Per docs/inherited/PROLIFERATED_PROJECT_PLAN.md §4.1.

name: M1_base
cell: M1

model:
  base_model: Qwen/Qwen2.5-VL-7B-Instruct
  K: 16
  lora_r: 32
  stage1_attention_mask: true

anchors:
  paths:
    - Qwen/Qwen2.5-VL-7B-Instruct
    - NOVAglow646/Monet-SFT-7B            # HF id; resolves via HF_HOME cache on bioai

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86
  K_q: 3
  curriculum_warmup_steps: 1000            # longer warmup at 100K scale

data:
  # M1 mix per docs/inherited/TRAINING_DATA_PLAN.md medium-mix recommendation
  mix:
    gqa: 0.40
    clevr: 0.15
    tallyqa: 0.10
    clevr_math: 0.10
    visual7w: 0.10
    ai2d: 0.10
    okvqa: 0.05
  n_samples: 100000

trainer:
  variant: A
  batch_size: 4
  gradient_checkpointing: true
  max_steps: 25000                          # rough estimate for 100K × 1 epoch / (B=4 × 4 GPUs)
  lr_lora: 5e-5
  lr_token: 5e-3
  eval_every_steps: 1000
  ckpt_every_steps: 1000
  max_time: 23h                             # for chained sbatch on gpu-4farm
  bf16: true

wandb:
  run_name: M1_base
  tags: [M1, training]
