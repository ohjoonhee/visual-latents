# Round-3 perm control for the no-norm variant. If the no-norm natural run
# achieves much better held-out NLL than the perm control, the gain is real
# (latents encode visual information). If both improve similarly, the gain is
# generic regularisation and the natural-vs-perm gap collapsed because we
# removed a confound.

name: interleaved_shapes_nonorm_perm_100
cell: interleaved_shapes_nonorm_perm_100

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8
  lora_r: 16
  stage1_attention_mask: false

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.3
  w_norm: 0.0
  target_norm: 57.86
  K_q: 2
  curriculum_warmup_steps: 10
  norm_weight_end: 0.0

data:
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved
  batch_size: 1
  gradient_checkpointing: false
  max_steps: 100
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 25
  ckpt_every_steps: 25

interleaved:
  T_blocks: 2
  k_latent: 4
  use_synthetic_data: true
  data_source: shapes
  permute_template: true

wandb:
  enabled: false
  run_name: interleaved_shapes_nonorm_perm_100
  tags: [interleaved, poc, local, shapes, no-norm, perm]
