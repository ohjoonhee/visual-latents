# Round-3 norm diagnostic (c3): apply L_norm only to first-of-block positions.
# Hypothesis: under Coconut recurrence, the recurrent positions inherit scale
# from the previous hidden state (self-sustaining magnitude). The first latent
# of each block is fed by the standard <|latent_start|> embedding, NOT by
# recurrence — so the standard scalar norm penalty should bite there.
#
# If THIS config drives ||h_first|| to target while the baseline (norm on all
# positions) plateaus at 100+, the recurrence is the cause.
#
# Run with:
#   MACHINE=local uv run python -m vl.train --config configs/diag/c3_first_latent_norm.yaml --variant interleaved

name: interleaved_norm_diag_c3
cell: interleaved_norm_diag/c3

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8
  lora_r: 16
  stage1_attention_mask: false

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86
  K_q: 2
  curriculum_warmup_steps: 5    # short; this is a 30-step diagnostic
  norm_weight_end: 0.1

data:
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved
  batch_size: 1
  gradient_checkpointing: false
  max_steps: 30
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 100   # skip eval — too short to be informative
  ckpt_every_steps: 100

interleaved:
  T_blocks: 2
  k_latent: 4
  use_synthetic_data: true
  data_source: shapes
  permute_template: false
  first_latent_norm_only: true

wandb:
  enabled: false
  run_name: interleaved_norm_diag_c3
  tags: [interleaved, poc, local, diag, norm]
