# Round-2 norm-regulariser diagnostic C1
# (docs/INTERLEAVED_POC_RESULTS.md §9, follow-up C).
#
# Identical to interleaved_mini.yaml except:
#   - loss.w_norm: 1.0   (10× the default 0.1)
#   - trainer.max_steps: 20
#
# Hypothesis test: if ‖h‖ collapses cleanly toward 57.86 with the heavier
# regulariser, the §6 self-sustaining-scale story is wrong (regulariser just
# needs more weight). If NLL diverges while ‖h‖ stays high, the recurrence is
# fighting the regulariser.
#
# Run with:
#   uv run python -m vl.train --config configs/diag/c1_wnorm_high.yaml --variant interleaved

name: interleaved_norm_diag/c1
cell: interleaved_norm_diag/c1

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8
  lora_r: 16
  stage1_attention_mask: false

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.3
  w_norm: 1.0                    # documented intent (note: actual scheduling
                                 # is via `norm_weight_end` below — see curriculum.py)
  target_norm: 57.86
  K_q: 2
  curriculum_warmup_steps: 10
  norm_weight_start: 0.0
  norm_weight_end: 1.0           # 10× the default 0.1 — the diagnostic
                                 # (the curriculum ramps norm_weight_start → norm_weight_end)

data:
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved
  batch_size: 1
  gradient_checkpointing: false
  max_steps: 20
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 25           # 25 > 20, so eval only fires at step 0 + final
  ckpt_every_steps: 25

interleaved:
  T_blocks: 2
  k_latent: 4
  use_synthetic_data: true

wandb:
  enabled: false
  run_name: interleaved_norm_diag/c1
  tags: [interleaved, poc, local, diagnostic]
