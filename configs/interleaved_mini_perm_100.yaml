# Interleaved Coconut-style POC config — 100-step PERMUTED CONTROL extension.
# Identical to interleaved_mini_perm.yaml except `trainer.max_steps: 100`.
# Used in round-2 follow-ups (docs/INTERLEAVED_POC_RESULTS.md §9).
#
# Run with:
#   uv run python -m vl.train --config configs/interleaved_mini_perm_100.yaml --variant interleaved

name: interleaved_mini_perm_100
cell: interleaved_mini_perm_100

model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  K: 8
  lora_r: 16
  stage1_attention_mask: false

anchors:
  paths:
    - Qwen/Qwen2.5-VL-3B-Instruct

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86
  K_q: 2
  curriculum_warmup_steps: 10

data:
  mix:
    gqa: 1.0
  n_samples: 60

trainer:
  variant: interleaved
  batch_size: 1
  gradient_checkpointing: false
  max_steps: 100
  lr_lora: 5.0e-5
  lr_token: 5.0e-3
  eval_every_steps: 25
  ckpt_every_steps: 25

interleaved:
  T_blocks: 2
  k_latent: 4
  use_synthetic_data: true
  permute_template: true        # design §11.3 control

wandb:
  enabled: false
  run_name: interleaved_mini_perm_100
  tags: [interleaved, poc, local, control]
