# Round-3 cell C1: full recipe (R=2, K=16, K_q=3, all losses, curriculum warmup).
# Per docs/inherited/ROUND3_POC_DESIGN.md §6. Pass thresholds in §1.

name: round3_C1_full
cell: C1

model:
  base_model: Qwen/Qwen2.5-VL-7B-Instruct
  K: 16
  lora_r: 32
  stage1_attention_mask: true

anchors:
  paths:
    - Qwen/Qwen2.5-VL-7B-Instruct
    - /data/joonhee/.cache/huggingface/hub/models--NOVAglow646--Monet-SFT-7B/snapshots/<TBD>/stage2
    # path resolved after download; smoke verifies the snapshot dir on local

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86
  K_q: 3
  curriculum_warmup_steps: 200
  nll_weight_start: 0.1
  nll_weight_end: 1.0
  norm_weight_start: 0.0
  norm_weight_end: 0.1
  concept_bottleneck_dim: 1792    # D/2 for D=3584

data:
  mix:
    gqa: 0.65
    clevr: 0.25
    tallyqa: 0.10
  n_samples: 10000
  shuffle_qa_within_image: false

trainer:
  variant: A
  batch_size: 4
  gradient_checkpointing: true
  max_steps: 1000
  lr_lora: 5e-5
  lr_token: 5e-3
  optim: adamw_torch
  eval_every_steps: 100
  ckpt_every_steps: 200
  bf16: true

wandb:
  enabled: true
  run_name: round3_C1_full
  tags: [round3, C1, full]
