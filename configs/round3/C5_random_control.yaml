# Round-3 cell C5: random-control. (image, q, a) shuffled within batch — kills
# any visual grounding signal. If C5 matches C1 on held-out NLL, the method is
# generic regularization (per arXiv:2004.05704 caveat reaffirmed in round-3 §17.1).
# Per docs/inherited/ROUND3_POC_DESIGN.md §6.

name: round3_C5_random_control
cell: C5

model:
  base_model: Qwen/Qwen2.5-VL-7B-Instruct
  K: 16
  lora_r: 32
  stage1_attention_mask: true

anchors:
  paths:
    - Qwen/Qwen2.5-VL-7B-Instruct
    - /data/joonhee/.cache/huggingface/hub/models--NOVAglow646--Monet-SFT-7B/snapshots/<TBD>/stage2

loss:
  w_concept: 0.3
  w_norm: 0.1
  target_norm: 57.86
  K_q: 3
  curriculum_warmup_steps: 200

data:
  mix: { gqa: 0.65, clevr: 0.25, tallyqa: 0.10 }
  n_samples: 10000
  shuffle_qa_within_image: true            # the random-control switch

trainer:
  variant: A
  batch_size: 4
  gradient_checkpointing: true
  max_steps: 1000
  lr_lora: 5e-5
  lr_token: 5e-3
  eval_every_steps: 100
  ckpt_every_steps: 200
  bf16: true

wandb:
  run_name: round3_C5_random_control
  tags: [round3, C5, control]
