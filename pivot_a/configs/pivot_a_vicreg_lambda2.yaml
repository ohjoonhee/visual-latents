# Pivot A — Variant D2: VICReg with lambda_reg=2.0
# Identical to pivot_a_vicreg.yaml except:
#   - lambda_reg: 2.0 (was 1.0 in C2)
#   - out_dir: pivot_a/results/vicreg_lambda2
# Hypothesis: stronger reg → mean cos even lower, possibly closer to
# Monet stage 2's 0.38. Robustness/reproducibility test.

base_model: Qwen/Qwen2.5-VL-3B-Instruct

K: 8
lambda_lvr: 1.0
loss_form: mean_d

# Pivot A regularizer (same VICReg params as C2, double weight)
reg_kind: vicreg
lambda_reg: 2.0
reg_var_w: 1.0
reg_cov_w: 0.04
reg_gamma: 1.0

# Optim / schedule
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 100
max_steps: 1000
grad_accum_steps: 4

# Memory
gradient_checkpointing: true

# Image processor
min_pixels: 3136
max_pixels: 401408

# Data
train_split: train
n_train_examples: 5000

# Logging
out_dir: pivot_a/results/vicreg_lambda2
log_every: 10
save_every: 500

seed: 0
