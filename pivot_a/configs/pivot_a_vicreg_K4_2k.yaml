# Pivot A — Experiment G: stack F's K=4 with E's 2× steps probe.
# Identical to pivot_a_vicreg_K4.yaml except:
#   - max_steps: 2000 (was 1000) — same 2× scaling as E
#   - warmup_steps: 200 (10% of total, scaled proportionally from 100)
#   - out_dir: pivot_a/results/vicreg_K4_2k
#   - save_every: 0 (NO intermediate checkpoints — disk-space lesson from F)
# Hypothesis: F's K=4 doubled n_helpful_rate (2/4=50%) and 2.6× utility
# (+0.132) over D2; E's 2× steps gave +76% utility at K=8 with no n_helpful
# move. Stacking K=4 + 2× steps should push utility ≥ +0.20 and ideally
# n_helpful → 3/4 (75%) to close the gap toward Monet stage 2 utility.

base_model: Qwen/Qwen2.5-VL-3B-Instruct

K: 4
lambda_lvr: 1.0
loss_form: mean_d

# Pivot A regularizer (same VICReg params as D2/F)
reg_kind: vicreg
lambda_reg: 2.0
reg_var_w: 1.0
reg_cov_w: 0.04
reg_gamma: 1.0

# Optim / schedule (warmup scaled 10% of total, like E)
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 200
max_steps: 2000
grad_accum_steps: 4

# Memory
gradient_checkpointing: true

# Image processor
min_pixels: 3136
max_pixels: 401408

# Data
train_split: train
n_train_examples: 5000

# Logging
out_dir: pivot_a/results/vicreg_K4_2k
log_every: 10
save_every: 0  # NO intermediate ckpts — only final saved at exit

seed: 0
