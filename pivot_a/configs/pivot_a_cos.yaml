# Pivot A — Variant C1: pairwise cosine hinge regularizer
# Identical to phase1_lvr/configs/lvr_3b_5k.yaml except for the reg_* fields.

base_model: Qwen/Qwen2.5-VL-3B-Instruct

K: 8
lambda_lvr: 1.0
loss_form: mean_d

# Pivot A regularizer
reg_kind: cos
lambda_reg: 1.0
reg_tau: 0.5

# Optim / schedule
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 100
max_steps: 1000
grad_accum_steps: 4

# Memory
gradient_checkpointing: true

# Image processor
min_pixels: 3136
max_pixels: 401408

# Data
train_split: train
n_train_examples: 5000

# Logging
out_dir: pivot_a/results/cos
log_every: 10
save_every: 500

seed: 0
