# Pivot A — Experiment F: D2 winning recipe with K=4 (instead of K=8).
# Identical to pivot_a_vicreg_lambda2.yaml except:
#   - K: 4 (was 8)
#   - out_dir: pivot_a/results/vicreg_K4
# Hypothesis: K=8 dilutes per-position loss signal across 5K × 8 slots = 40K
# updates. Reducing to K=4 (5K × 4 = 20K) may concentrate the signal so more
# positions become individually informative (close the n_helpful gap).

base_model: Qwen/Qwen2.5-VL-3B-Instruct

K: 4
lambda_lvr: 1.0
loss_form: mean_d

# Pivot A regularizer (same VICReg params as D2)
reg_kind: vicreg
lambda_reg: 2.0
reg_var_w: 1.0
reg_cov_w: 0.04
reg_gamma: 1.0

# Optim / schedule
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 100
max_steps: 1000
grad_accum_steps: 4

# Memory
gradient_checkpointing: true

# Image processor
min_pixels: 3136
max_pixels: 401408

# Data
train_split: train
n_train_examples: 5000

# Logging
out_dir: pivot_a/results/vicreg_K4
log_every: 10
save_every: 500

seed: 0
