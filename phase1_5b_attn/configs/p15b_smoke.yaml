# Phase 1.5b — smoke (50 steps to verify no NaN with mask injection)
base_model: Qwen/Qwen2.5-VL-3B-Instruct

K: 8
lambda_lvr: 1.0

lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 10
max_steps: 50
grad_accum_steps: 4

gradient_checkpointing: true

min_pixels: 3136
max_pixels: 401408

train_split: train
n_train_examples: 250
out_dir: phase1_5b_attn/results/smoke
log_every: 5
save_every: 0

seed: 0
